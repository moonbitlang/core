name: "Run MoonBit Native Release Tests"
description: "Run MoonBit tests with --target native --release"
runs:
  using: "composite"
  steps:
    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: Set ulimit and run moon test (--release + --target native)
      if: ${{ runner.os != 'Windows' }}
      shell: bash
      env:
        MOON_CC_WRAPPER: sccache
        SCCACHE_GHA_ENABLED: "true"
        SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
      run: |
        ulimit -s 8176
        moon test --target native --release async/socket --build-only
        for _ in $(seq 1 100); do
          ./_build/native/release/test/async/socket/socket.blackbox_test.exe 'udp_test.mbt:0-1/reuse_port_test.mbt:0-1/reuse_addr_test.mbt:0-4/resolve_host_test.mbt:0-5/read_exactly_test.mbt:0-2/multicast_test.mbt:0-5/getsockname_test.mbt:0-2/dual_stack_test.mbt:0-6/connect_burst_test.mbt:0-2/addr_test.mbt:6-7'
        done

    - name: Setup MSVC
      if: ${{ runner.os == 'Windows' }}
      uses: ilammy/msvc-dev-cmd@v1

    - name: Run moon test on Windows (--release + --target native)
      if: ${{ runner.os == 'Windows' }}
      shell: bash
      env:
        MOON_CC_WRAPPER: sccache
        SCCACHE_GHA_ENABLED: "true"
        SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
      run: |
        moon test --target native --release
