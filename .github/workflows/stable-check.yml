name: stable-check

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

# Only supersede runs for the same PR; other events remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  MOON_COVE_REPORT_ENABLED: "1"
  MOON_WASM_NEW_ALLOCATOR: "1"

jobs:
  stable-native-opt-test:
    strategy:
      matrix:
        os: ["ubuntu-latest"]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    steps:
      - name: disable auto CRLF
        if: ${{ matrix.os == 'windows-latest' }}
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: install
        uses: ./.github/actions/setup

      - name: check
        timeout-minutes: 5
        run: moon check --target native --deny-warn

      - name: run native release tests
        timeout-minutes: 15
        uses: ./.github/actions/test-native-release

  stable-native-opt-test-2:
